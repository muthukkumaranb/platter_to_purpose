{% extends 'base.html' %}

{% block content %}
<div class="container" style="max-width: 600px; margin-top: 40px;">
    <div class="card" style="padding: 40px;">
        <h2 style="text-align: center; margin-bottom: 24px;">Rate Your Experience</h2>

        <div style="background: var(--light); padding: 16px; border-radius: 8px; margin-bottom: 24px;">
            <p><strong>Food:</strong> {{ order.food_post.title }}</p>
            <p><strong>Donor:</strong> {{ order.food_post.donor.username }}</p>
        </div>

        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label style="display: block; margin-bottom: 8px; font-weight: 600;">Rating</label>
                <div class="star-rating-input">
                    <span class="star" data-value="1">★</span>
                    <span class="star" data-value="2">★</span>
                    <span class="star" data-value="3">★</span>
                    <span class="star" data-value="4">★</span>
                    <span class="star" data-value="5">★</span>
                </div>
                <!-- Hidden select to store value -->
                <select name="rating" id="id_rating" required style="display: none;">
                    <option value="" selected disabled>Select Rating</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>

                <style>
                    .star-rating-input {
                        font-size: 2rem;
                        color: #ddd;
                        cursor: pointer;
                        display: inline-block;
                    }

                    .star-rating-input .star {
                        margin-right: 4px;
                        transition: color 0.2s;
                    }

                    .star-rating-input .star:hover,
                    .star-rating-input .star.hovered,
                    .star-rating-input .star.selected {
                        color: #F4A261;
                    }
                </style>

                <script>
                    document.addEventListener('DOMContentLoaded', function () {
                        const stars = document.querySelectorAll('.star-rating-input .star');
                        const hiddenInput = document.getElementById('id_rating');

                        // Remove hover effect on leave (unless selected)
                        if (stars.length > 0) {
                            stars[0].parentElement.addEventListener('mouseleave', () => {
                                stars.forEach(s => s.classList.remove('hovered'));
                            });
                        }

                        stars.forEach(star => {
                            // Hover effect
                            star.addEventListener('mouseenter', () => {
                                const val = parseInt(star.getAttribute('data-value'));
                                stars.forEach(s => {
                                    if (parseInt(s.getAttribute('data-value')) <= val) {
                                        s.classList.add('hovered');
                                    } else {
                                        s.classList.remove('hovered');
                                    }
                                });
                            });

                            // Click to select
                            star.addEventListener('click', () => {
                                const val = star.getAttribute('data-value');
                                hiddenInput.value = val;

                                stars.forEach(s => {
                                    if (parseInt(s.getAttribute('data-value')) <= parseInt(val)) {
                                        s.classList.add('selected');
                                    } else {
                                        s.classList.remove('selected');
                                    }
                                });
                            });
                        });
                    });
                </script>
            </div>

            <div class="form-group">
                <label>Comments</label>
                {{ form.comment }}
            </div>

            <button type="submit" class="btn" style="width: 100%;">Submit Feedback</button>
        </form>
    </div>
</div>
{% endblock %}
