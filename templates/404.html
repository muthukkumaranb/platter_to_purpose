{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div
    style="min-height: 50vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 16px;">
    <div style="font-size: 5rem; font-weight: 800; color: var(--brand-500); line-height: 1; margin-bottom: 16px;">404
    </div>
    <h1 style="font-size: 1.5rem; margin-bottom: 12px; font-weight: 800;">Page Not Found</h1>
    <p style="color: var(--text); font-size: 13px; max-width: 420px; margin-bottom: 28px; line-height: 1.6;">
        The page you're looking for might have been removed or is temporarily unavailable.
    </p>
    <div style="display: flex; gap: 10px; flex-wrap: wrap; justify-content: center;">
        <a href="{% url 'home' %}" class="btn" style="padding: 10px 28px;">Go Home</a>
        <a href="javascript:history.back()" class="btn btn-outline" style="padding: 10px 28px;">Go Back</a>
    </div>
</div>
{% endblock %}
